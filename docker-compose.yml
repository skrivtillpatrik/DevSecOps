services:
  frontend:
    build:
      context: ./frontend
      args:
        - API_URL=http://backend:3000
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - CORS_ORIGINS=http://localhost:8080,http://localhost:3001

